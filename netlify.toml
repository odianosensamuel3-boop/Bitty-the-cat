# Netlify — static deploy of the Bitty the Cat site.
# The repo contains other projects, so `base` points at this folder.
# If you create a repo containing ONLY this folder, delete the `base` line.

[build]
  base = "bitty-the-cat"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Everything below is optional; public/_headers already covers the same rules.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
